[[quiz.coding]]
id = "1-q1"
prompt = "`fizzbuzz(n: u32) -> String` fonksiyonunu yaz. `n` 15'e tam bölünüyorsa \"FizzBuzz\", 3'e bölünüyorsa \"Fizz\", 5'e bölünüyorsa \"Buzz\" döndür. Hiçbirine bölünmüyorsa sayının kendisini metin olarak döndür. Örnekler: 3 → \"Fizz\", 5 → \"Buzz\", 30 → \"FizzBuzz\", 7 → \"7\". İpucu: 15 kontrolünü en başa koy; yoksa 15 için önce 3 kontrolü tutar ve \"Fizz\" döner. Sayıyı metne çevirmek için `format!(\"{}\", n)` yazabilirsin."
starter = '''
fn fizzbuzz(n: u32) -> String {
    todo!()
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn fizz_buzz_kurallari() {
        assert_eq!(fizzbuzz(3), "Fizz");
        assert_eq!(fizzbuzz(5), "Buzz");
        assert_eq!(fizzbuzz(15), "FizzBuzz");
        assert_eq!(fizzbuzz(7), "7");
        assert_eq!(fizzbuzz(30), "FizzBuzz");
    }
}
'''
solution = '''
fn fizzbuzz(n: u32) -> String {
    if n % 15 == 0 {
        String::from("FizzBuzz")
    } else if n % 3 == 0 {
        String::from("Fizz")
    } else if n % 5 == 0 {
        String::from("Buzz")
    } else {
        format!("{}", n)
    }
}
'''
points = 50
