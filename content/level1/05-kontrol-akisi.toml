tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn cift_toplam() {
        assert_eq!(sum_even(10), 30);
        assert_eq!(sum_even(0), 0);
        assert_eq!(sum_even(1), 0);
        assert_eq!(sum_even(7), 12);
    }
}
'''
solution = '''
fn sum_even(limit: u32) -> u32 {
    let mut total = 0;
    for i in 1..=limit {
        if i % 2 == 0 {
            total += i;
        }
    }
    total
}
'''
