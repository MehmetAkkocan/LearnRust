tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn bolum_ve_kalan() {
        assert_eq!(divmod(17, 5), (3, 2));
        assert_eq!(divmod(10, 2), (5, 0));
        assert_eq!(divmod(3, 7), (0, 3));
    }
}
'''
solution = '''
fn divmod(a: i32, b: i32) -> (i32, i32) {
    (a / b, a % b)
}
