solution = '''
mod geometry {
    pub mod rect {
        pub fn area(w: u32, h: u32) -> u32 {
            w * h
        }

        pub fn perimeter(w: u32, h: u32) -> u32 {
            2 * (w + h)
        }
    }

    pub fn square_area(side: u32) -> u32 {
        rect::area(side, side)
    }
}
'''
