solution = '''
#[derive(Debug)]
enum Command {
    Quit,
    Move { x: i32, y: i32 },
    Write(String),
    Color(u8, u8, u8),
}

fn score(c: &Command) -> i32 {
    match c {
        Command::Quit => 0,
        Command::Move { x, y } => x.abs() + y.abs(),
        Command::Write(s) => s.len() as i32,
        Command::Color(r, g, b) => *r as i32 + *g as i32 + *b as i32,
    }
}

fn grade_letter(points: u32) -> char {
    match points {
        90..=100 => 'A',
        80..=89 => 'B',
        70..=79 => 'C',
        0..=69 => 'D',
        _ => 'X',
    }
}
'''
