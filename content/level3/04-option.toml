id = "3-04"
title = "Option: Değer Olabilir de Olmayabilir de"
read_points = 10
body_md = '''
## Neden

Bir listede bir sayı arıyorsun. Bulursan sırasını döndüreceksin; peki
bulamazsan? Birçok dilde bu durumda `null` döner. Sorun şu: `null` gelip
gelmediğine bakmayı unutursan program çalışırken çöker ve derleyici seni
önceden uyarmaz. Rust'ta `null` yoktur. "Değer olmayabilir" bilgisini tipin
kendisi taşır: `Option<T>`. Bu, standart kütüphanede hazır gelen iki
variant'lı bir enum'dur: değer varsa `Some(değer)`, yoksa `None`. İçindeki
değeri kullanmak için önce "var mı?" diye bakmak zorundasın; bakmazsan kod
derlenmez.

## Nasıl

```rust
fn find_index(v: &[i32], target: i32) -> Option<usize> {
    for (i, x) in v.iter().enumerate() {
        if *x == target {
            return Some(i);
        }
    }
    None
}
```

`v.iter().enumerate()` elemanları sıra numarasıyla birlikte verir: `i` sıra
numarası, `x` elemana referanstır. Sayı bulunursa `Some(i)` döner; döngü bitip
de bulunamadıysa `None`.

Dönen `Option` ile şunları yapabilirsin (`r` sonucu tutan değişken olsun):

- `match` ile iki durumu ayrı ayrı yaz:
  `match r { Some(i) => ..., None => ... }`. `Some(i)` deseni içerideki değeri
  `i` adıyla sana verir.
- `r.unwrap_or(0)`: değer varsa onu, yoksa verdiğin varsayılanı alırsın.
- `r.map(|x| x * 2)`: değer varsa onu dönüştürür, `None` ise `None` bırakır.
  `|x| x * 2` yerinde yazılmış küçük bir fonksiyondur (closure); ayrıntısı
  Seviye 5'te.
- `r.is_some()` ve `r.is_none()`: yalnızca var mı yok mu diye bakar, `bool`
  döndürür.

Standart kütüphane de sık sık `Option` döndürür. Bir slice'ta `v.first()` ilk
elemanı, `v.get(i)` `i` numaralı elemanı verir; öyle bir eleman yoksa ikisi de
`None` döndürür.

## Dikkat

- `unwrap()` değeri doğrudan çıkarır, ama değer `None` ise program panic ile
  durur. Denemelerde iş görür; asıl kodda `match` ya da `unwrap_or` kullan.
- `Option<i32>` ile `i32` ayrı tiplerdir. `Some(5) + 1` derlenmez; önce
  içindeki değeri çıkarman gerekir.
- Fonksiyonun `Option<i32>` döndürüyorsa düz `5` döndüremezsin, `Some(5)`
  yazmalısın. Yoksa derleyici `` expected `Option<i32>`, found integer `` der.
- `Some` ve `None` her yerde hazırdır; `Option::Some` diye uzun yazmana gerek
  yok.
'''
example = '''
fn find_index(v: &[i32], target: i32) -> Option<usize> {
    for (i, x) in v.iter().enumerate() {
        if *x == target {
            return Some(i);
        }
    }
    None
}

fn main() {
    let data = [10, 20, 30];
    match find_index(&data, 20) {
        Some(i) => println!("bulundu, sırası: {}", i),
        None => println!("yok"),
    }
    // 99 listede yok; None yerine 0 alırız
    let missing = find_index(&data, 99).unwrap_or(0);
    println!("bulunamayınca varsayılan: {}", missing);
    let doubled = Some(21).map(|x| x * 2);
    println!("{:?}", doubled);
    println!("{:?}", data.first());
}
'''

