solution = '''
fn safe_div(a: i32, b: i32) -> Option<i32> {
    if b == 0 {
        None
    } else {
        Some(a / b)
    }
}

fn first_even(v: &[i32]) -> Option<i32> {
    for x in v {
        if x % 2 == 0 {
            return Some(*x);
        }
    }
    None
}

fn double_opt(o: Option<i32>) -> Option<i32> {
    match o {
        Some(x) => Some(x * 2),
        None => None,
    }
}
'''
