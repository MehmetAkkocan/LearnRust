solution = '''
fn describe_opt(o: Option<i32>) -> String {
    if let Some(n) = o {
        format!("val:{}", n)
    } else {
        "none".to_string()
    }
}

fn sum_stack(mut v: Vec<i32>) -> i32 {
    let mut total = 0;
    while let Some(x) = v.pop() {
        total += x;
    }
    total
}

fn count_some(v: &[Option<i32>]) -> usize {
    let mut n = 0;
    for item in v {
        if let Some(_) = item {
            n += 1;
        }
    }
    n
}
'''
