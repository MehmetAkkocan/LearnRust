id = "3-06"
title = "if let ve while let: Tek Durumla İlgilenmek"
read_points = 10
body_md = '''
## Neden

Bazen bir `Option`'ın yalnızca tek durumu seni ilgilendirir: değer varsa bir
şey yapacaksın, yoksa hiçbir şey. Bunu `match` ile yazınca boş bir kol eklemek
zorunda kalırsın:

```rust
match maybe {
    Some(n) => println!("{}", n),
    None => {}
}
```

`if let` ile aynı işi daha kısa yazarsın. `while let` de aynı fikrin döngü
hali: desen uyduğu sürece döner.

## Nasıl

`if let desen = ifade { ... }` şöyle okunur: "ifade bu desene uyuyorsa bloğu
çalıştır". İstersen `else` ekleyip uymadığı durumu da yazarsın.

```rust
let name: Option<String> = Some(String::from("Ayşe"));
if let Some(n) = &name {
    println!("merhaba {}", n);
} else {
    println!("isim yok");
}
```

`n` yalnızca o bloğun içinde vardır. Aynı yazım kendi enum'larında da çalışır:
`if let Command::Write(s) = &c { ... }`.

`while let` her turda ifadeyi yeniden hesaplar; desen uyarsa gövdeyi
çalıştırır, uymazsa döngüden çıkar.

```rust
let mut stack = vec![1, 2, 3];
while let Some(top) = stack.pop() {
    println!("{}", top); // 3, 2, 1
}
```

Burada iki yeni şey var. `Vec<i32>`, büyüyüp küçülebilen bir listedir ve
`vec![1, 2, 3]` ile oluşturulur; ayrıntısını Seviye 4'te göreceksin. Bu derste
yalnızca `pop()` lazım: listenin son elemanını çıkarıp `Some(eleman)` olarak
verir, liste boşsa `None` döndürür. Liste her turda bir eleman kısaldığı için
sonunda `None` gelir ve döngü kendiliğinden biter.

## Dikkat

- `if let`, öteki durumları da yazıp yazmadığına bakmaz; birini unutsan da
  kod derlenir. Bütün durumlar önemliyse `match` kullan.
- Desenle ifadenin arasında tek `=` var. Bu bir karşılaştırma (`==`) değil,
  değeri desene uydurmadır.
- `while let`'te ifade her turda aynı sonucu veriyorsa döngü hiç bitmez.
  `pop()` listeyi kısalttığı için burada böyle bir tehlike yok.
- `if let Some(n) = name` yazarsan içerideki `String`, `n`'ye taşınır (move)
  ve `name` artık kullanılamaz. `name` sana sonra da lazımsa `&name` yazıp
  ödünç al (borrow).
'''
example = '''
fn main() {
    let maybe: Option<i32> = Some(7);
    if let Some(n) = maybe {
        println!("değer: {}", n);
    } else {
        println!("değer yok");
    }

    let mut stack = vec![1, 2, 3];
    let mut total = 0;
    // pop() sondan başlar: önce 3, sonra 2, sonra 1 gelir
    while let Some(top) = stack.pop() {
        println!("çıkarıldı: {}", top);
        total += top;
    }
    println!("toplam: {}", total);
}
'''

