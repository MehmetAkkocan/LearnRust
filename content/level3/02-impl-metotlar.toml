solution = '''
#[derive(Debug)]
struct Account {
    balance: i64,
}

impl Account {
    fn new(initial: i64) -> Self {
        Account { balance: initial }
    }

    fn deposit(&mut self, amount: i64) {
        self.balance += amount;
    }

    fn withdraw(&mut self, amount: i64) -> bool {
        if amount <= self.balance {
            self.balance -= amount;
            true
        } else {
            false
        }
    }

    fn balance(&self) -> i64 {
        self.balance
    }
}
'''
