id = "3-03"
title = "Enum: Belli Seçeneklerden Biri"
read_points = 10
body_md = '''
## Neden

Bazı değerler birkaç seçenekten yalnızca biri olabilir. Yön buna iyi bir
örnek: kuzey, doğu, güney ya da batı. Bunu sayıyla tutabilirsin (0 kuzey,
1 doğu...), ama o zaman biri yanlışlıkla `7` yazar ve derleyici hiçbir şey
demez. Metinle tutarsan bu kez `"kuzy"` gibi bir yazım hatası gözden kaçar.
`enum` ile seçenekleri tek tek sayarsın; o tipten bir değer bunlardan biri
olmak zorundadır. Listede olmayan bir şey yazarsan program derlenmez.

## Nasıl

Enum'un her seçeneğine variant denir. Bir variant yalın bir ad olabilir ya da
yanında veri taşıyabilir.

```rust
enum Message {
    Quit,                    // veri taşımaz
    Move { x: i32, y: i32 }, // adlı alanlar, struct gibi
    Write(String),           // adsız alan, tuple gibi
}

let m = Message::Write(String::from("selam"));
```

Variant'ı `EnumAdi::Variant` diye yazarsın. Hangi variant olursa olsun değerin
tipi `Message`'dır; hepsini aynı fonksiyona verebilirsin.

Elindeki değerin hangi variant olduğuna `match` ile bakarsın. Her satır bir
koldur (arm): solda desen, `=>` işaretinden sonra o durumda üretilecek değer.

```rust
fn is_quit(m: &Message) -> bool {
    match m {
        Message::Quit => true,
        _ => false,
    }
}
```

`_` "geri kalan her şey" demektir. `match`'i iki ders sonra ayrıntılı
göreceksin; şimdilik bu kadarı yeter.

Struct'ta olduğu gibi enum'a da `impl` ile metot ekleyebilirsin. Veri
taşımayan enum'larda `#[derive(Debug, PartialEq, Clone, Copy)]` yazmak işini
kolaylaştırır: değerleri `==` ile karşılaştırırsın, bir değeri başka bir yere
verdiğinde de taşınmaz, kopyalanır.

## Dikkat

- `match` bütün variant'ları karşılamak zorundadır. Birini unutursan kod
  derlenmez ve derleyici eksik olanı söyler:
  `` non-exhaustive patterns: `Message::Write(_)` not covered ``. Enum'a
  sonradan variant eklediğinde de aynı hata, güncellemen gereken yerleri tek
  tek gösterir.
- `PartialEq` derive etmediysen iki enum değerini `==` ile karşılaştıramazsın.
- Variant'ın adını tek başına yazamazsın: `Quit` değil, `Message::Quit`.
  (`use Message::*;` yazarsan ön eke gerek kalmaz; `use`'u bu seviyenin son
  dersinde göreceksin.)
'''
example = '''
#[derive(Debug)]
enum Message {
    Quit,
    Move { x: i32, y: i32 },
    Write(String),
}

impl Message {
    fn describe(&self) -> String {
        match self {
            Message::Quit => String::from("çık"),
            Message::Move { x, y } => format!("git: {}, {}", x, y),
            Message::Write(text) => format!("yaz: {}", text),
        }
    }
}

fn main() {
    // vec![...] bir liste oluşturur (ayrıntısı Seviye 4'te); for ile sırayla dolaşıyoruz
    let msgs = vec![
        Message::Quit,
        Message::Move { x: 3, y: -1 },
        Message::Write(String::from("selam")),
    ];
    for m in &msgs {
        println!("{:?} -> {}", m, m.describe());
    }
}
'''

[exercise]
