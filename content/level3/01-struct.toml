solution = '''
#[derive(Debug, PartialEq, Clone, Copy)]
struct Point {
    x: i32,
    y: i32,
}

fn make_point(x: i32, y: i32) -> Point {
    Point { x, y }
}

fn manhattan(p: &Point) -> i32 {
    p.x.abs() + p.y.abs()
}

fn shift(p: Point, dx: i32, dy: i32) -> Point {
    Point { x: p.x + dx, y: p.y + dy }
}
'''
