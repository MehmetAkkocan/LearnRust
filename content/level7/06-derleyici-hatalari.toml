solution = '''
pub struct Inventory {
    pub items: Vec<String>,
    pub log: Vec<String>,
}

impl Inventory {
    pub fn longest_index(&self) -> Option<usize> {
        let mut best: Option<usize> = None;
        for (i, s) in self.items.iter().enumerate() {
            match best {
                Some(b) if self.items[b].len() >= s.len() => {}
                _ => best = Some(i),
            }
        }
        best
    }

    pub fn log_all(&mut self) {
        for item in &self.items {
            self.log.push(format!("saw:{}", item));
        }
    }

    pub fn upcase_longest(&mut self) {
        if let Some(i) = self.longest_index() {
            let upper = self.items[i].to_uppercase();
            self.items[i] = upper;
        }
    }
}

pub fn transfer(v: &mut [i32], from: usize, to: usize, amount: i32) {
    v[from] -= amount;
    v[to] += amount;
}
'''
