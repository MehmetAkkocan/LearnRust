id = "7-02"
title = "extern \"C\" ve FFI"
read_points = 10
body_md = '''
## Neden

İşletim sistemi ve sayısız kütüphane C ile yazılmıştır. Onları Rust'tan çağırmak ya da Rust'ta yazdığın bir fonksiyonu onlara vermek isteyebilirsin. Başka bir dilde yazılmış fonksiyonu çağırmaya FFI (foreign function interface) denir. İki tarafın anlaşabilmesi için aynı ABI'yi kullanması gerekir. ABI, derlenmiş kodun çağrı kurallarıdır: parametreler nereye konur, sonuç nereden okunur. Ortak dil olarak hemen herkes C'nin ABI'sini kullanır; `extern "C"` de bunu seçer.

## Nasıl

İşin iki yönü var. Dışarıda hazır duran bir fonksiyonu kullanmak için imzasını bir `extern "C"` bloğunda bildirirsin:

```rust
use std::os::raw::{c_char, c_int};
extern "C" {
    fn abs(x: c_int) -> c_int;
    fn strlen(s: *const c_char) -> usize;
}
```

Bu fonksiyonları ancak `unsafe` içinde çağırabilirsin, çünkü derleyici yazdığın imzanın gerçeğiyle aynı olup olmadığını denetleyemez.

Öbür yönde, Rust'ta yazdığın bir fonksiyonun C ABI'siyle çağrılabilmesini istiyorsan başına `extern "C"` koyarsın:

```rust
extern "C" fn add(a: i32, b: i32) -> i32 { a + b }
```

Bunu Rust'tan her zamanki gibi çağırırsın. Ayrıca `extern "C" fn(i32, i32) -> i32` tipinde bir değişkene atayabilirsin; C kütüphanelerine callback (sonradan çağrılacak fonksiyon) tam böyle verilir.

Metinlerde dikkat edeceğin bir fark var. C'de metin, sonuna konan bir sıfır baytıyla biter; `&str`'de böyle bir bayt yoktur. `CString::new(s)` sonuna sıfır baytı eklenmiş bir kopya üretir; metnin ortasında sıfır baytı varsa `Err` döndürür. C'ye vereceğin pointer'ı `c.as_ptr()` ile alırsın.

`unsafe` çağrıyı burada da güvenli bir fonksiyonun içine sakla: `fn c_len(s: &str) -> usize` gibi.

## Dikkat

- Bildirdiğin imza gerçek C imzasına uymuyorsa sonuç UB'dir ve derleyici seni uyarmaz.
- `as_ptr()` ile aldığın pointer, `CString` silinene (drop) kadar geçerlidir. `CString`'i bir değişkende tut.
- `abs(i32::MIN)` C'de tanımsızdır, çünkü sonuç `i32`'ye sığmaz. Güvenli fonksiyonunda bu girdiyi ayrıca ele al.
- `extern "C" fn` içindeki bir panic C tarafına geçemez; program o anda sonlanır (abort). Hatayı dönüş değeriyle bildir.
- Bu derste C dosyası derlemiyoruz. Yalnızca C standart kütüphanesinde (libc) hazır bulunan fonksiyonları ve Rust'ta yazdığımız `extern "C" fn`'leri kullanıyoruz.
'''
example = '''
use std::ffi::CString;
use std::os::raw::{c_char, c_int};

extern "C" {
    fn abs(x: c_int) -> c_int;
    fn strlen(s: *const c_char) -> usize;
}

extern "C" fn add(a: i32, b: i32) -> i32 {
    a + b
}

fn safe_abs(x: i32) -> i32 {
    if x == i32::MIN {
        return i32::MAX;
    }
    unsafe { abs(x) }
}

fn c_len(s: &str) -> usize {
    let c = CString::new(s).expect("metnin içinde sıfır baytı olmamalı");
    unsafe { strlen(c.as_ptr()) }
}

fn main() {
    let f: extern "C" fn(i32, i32) -> i32 = add;
    println!("add = {}", f(2, 3));
    println!("abs = {}", safe_abs(-42));
    println!("strlen = {}", c_len("merhaba"));
}
'''

[exercise]
prompt = "`extern \"C\" fn saturating_add_i32(a: i32, b: i32) -> i32` fonksiyonunu yaz. `a + b`'yi döndürür; ama toplam `i32`'ye sığmıyorsa panic etmek yerine sınırda kalır: toplam fazla büyükse `i32::MAX`, fazla küçükse `i32::MIN` döner. Örnek: `(2, 3)` → `5`, `(i32::MAX, 1)` → `i32::MAX`, `(i32::MIN, -1)` → `i32::MIN`. İpucu: tam sayılardaki `a.saturating_add(b)` metodu tam olarak bunu yapar. İstersen kendin de yazabilirsin: iki sayıyı `as i64` ile `i64`'e çevirip topla, sonra toplamı sınırlarla karşılaştır."
starter = '''
extern "C" fn saturating_add_i32(a: i32, b: i32) -> i32 {
    todo!()
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn normal_sum() {
        assert_eq!(saturating_add_i32(2, 3), 5);
        assert_eq!(saturating_add_i32(-4, 1), -3);
    }
    #[test]
    fn saturates() {
        assert_eq!(saturating_add_i32(i32::MAX, 1), i32::MAX);
        assert_eq!(saturating_add_i32(i32::MIN, -1), i32::MIN);
    }
    #[test]
    fn usable_as_fn_pointer() {
        let f: extern "C" fn(i32, i32) -> i32 = saturating_add_i32;
        assert_eq!(f(10, 20), 30);
    }
}
'''
solution = '''
extern "C" fn saturating_add_i32(a: i32, b: i32) -> i32 {
    a.saturating_add(b)
}
'''
