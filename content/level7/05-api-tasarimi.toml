#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn port_from_u16() {
        assert_eq!(Port::from(80u16), Port(80));
    }
    #[test]
    fn default_values() {
        let c = Config::default();
        assert_eq!(c.host, "localhost");
        assert_eq!(c.port, Port(8080));
        assert_eq!(c.retries, 3);
    }
    #[test]
    fn builder_defaults_match() {
        assert_eq!(ConfigBuilder::new().build(), Config::default());
    }
    #[test]
    fn builder_chain() {
        let c = ConfigBuilder::new().host("example.com").port(443u16).retries(5).build();
        assert_eq!(c.host, "example.com");
        assert_eq!(c.port, Port(443));
        assert_eq!(c.retries, 5);
        let d = ConfigBuilder::new().port(Port(1)).build();
        assert_eq!(d.port, Port(1));
        assert_eq!(d.host, "localhost");
    }
}
