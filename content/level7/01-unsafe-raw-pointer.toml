solution = '''
fn last_raw(v: &[i32]) -> Option<i32> {
    if v.is_empty() {
        None
    } else {
        // SAFETY: slice boş değil; len - 1 geçerli bir indeks.
        Some(unsafe { *v.as_ptr().add(v.len() - 1) })
    }
}
'''
