solution = '''
pub trait Pricing {
    fn price(&self, base: u32) -> u32;
}

pub struct Flat(pub u32);
pub struct Percent(pub u32);

impl Pricing for Flat {
    fn price(&self, base: u32) -> u32 {
        base.saturating_sub(self.0)
    }
}

impl Pricing for Percent {
    fn price(&self, base: u32) -> u32 {
        base - base * self.0 / 100
    }
}

impl<T: Pricing + ?Sized> Pricing for Box<T> {
    fn price(&self, base: u32) -> u32 {
        (**self).price(base)
    }
}

pub fn apply_all(list: &[Box<dyn Pricing>], base: u32) -> Vec<u32> {
    list.iter().map(|s| s.price(base)).collect()
}

pub fn apply_generic<S: Pricing>(s: &S, base: u32) -> u32 {
    s.price(base)
}

pub fn apply_chain(list: &[Box<dyn Pricing>], base: u32) -> u32 {
    list.iter().fold(base, |acc, s| s.price(acc))
}
'''
