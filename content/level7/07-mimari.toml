tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn strategies_directly() {
        assert_eq!(Flat(30).price(100), 70);
        assert_eq!(Flat(200).price(100), 0);
        assert_eq!(Percent(25).price(100), 75);
    }

    #[test]
    fn generic_path() {
        assert_eq!(apply_generic(&Flat(5), 20), 15);
        assert_eq!(apply_generic(&Percent(10), 200), 180);
        let boxed: Box<dyn Pricing> = Box::new(Percent(50));
        assert_eq!(apply_generic(&boxed, 10), 5);
    }

    #[test]
    fn dyn_path() {
        let list: Vec<Box<dyn Pricing>> = vec![Box::new(Flat(10)), Box::new(Percent(50))];
        assert_eq!(apply_all(&list, 100), vec![90, 50]);
        let empty: Vec<Box<dyn Pricing>> = Vec::new();
        assert_eq!(apply_all(&empty, 100), Vec::<u32>::new());
    }

    #[test]
    fn chain_applies_in_order() {
        let list: Vec<Box<dyn Pricing>> = vec![Box::new(Flat(20)), Box::new(Percent(50))];
        assert_eq!(apply_chain(&list, 100), 40);
        let reversed: Vec<Box<dyn Pricing>> = vec![Box::new(Percent(50)), Box::new(Flat(20))];
        assert_eq!(apply_chain(&reversed, 100), 30);
        let empty: Vec<Box<dyn Pricing>> = Vec::new();
        assert_eq!(apply_chain(&empty, 77), 77);
    }
}
