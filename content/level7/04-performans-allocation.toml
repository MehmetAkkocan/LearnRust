tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn csv_joins_without_trailing_comma() {
        assert_eq!(build_csv(&["a", "b", "c"]), "a,b,c");
        assert_eq!(build_csv(&["solo"]), "solo");
        assert_eq!(build_csv(&[]), "");
    }
    #[test]
    fn csv_reserves_capacity() {
        let s = build_csv(&["ab", "cd"]);
        assert_eq!(s, "ab,cd");
        assert!(s.capacity() >= 5);
    }
    #[test]
    fn first_word_works() {
        assert_eq!(first_word("hello world"), "hello");
        assert_eq!(first_word("  lead x"), "lead");
        assert_eq!(first_word(""), "");
        assert_eq!(first_word("tek"), "tek");
    }
}
'''
solution = '''
fn build_csv(items: &[&str]) -> String {
    let total: usize = items.iter().map(|s| s.len()).sum::<usize>() + items.len();
    let mut out = String::with_capacity(total);
    for (i, item) in items.iter().enumerate() {
        if i > 0 {
            out.push(',');
        }
        out.push_str(item);
    }
    out
}

fn first_word(s: &str) -> &str {
    s.split_whitespace().next().unwrap_or("")
}
'''
