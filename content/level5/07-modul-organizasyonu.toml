tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn yeterli_mi() {
        assert!(bank::account::can_afford(1000, 500));
        assert!(!bank::account::can_afford(500, 500));
        assert!(bank::account::can_afford(101, 100));
    }
    #[test]
    fn cekim() {
        assert_eq!(bank::withdraw(1000, 500), Some(495));
        assert_eq!(bank::withdraw(100, 100), None);
        assert_eq!(bank::withdraw(101, 100), Some(0));
    }
}
'''
solution = '''
mod bank {
    pub mod account {
        pub(super) fn fee(amount: u32) -> u32 {
            amount / 100
        }

        pub(crate) fn can_afford(balance: u32, amount: u32) -> bool {
            balance >= amount + fee(amount)
        }
    }

    pub fn withdraw(balance: u32, amount: u32) -> Option<u32> {
        if account::can_afford(balance, amount) {
            Some(balance - amount - account::fee(amount))
        } else {
            None
        }
    }
}
'''
