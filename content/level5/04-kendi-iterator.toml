id = "5-04"
title = "Kendi Iterator'ını Yaz"
read_points = 10
body_md = '''
## Neden

`for` döngüsü ve geçen derste gördüğün `map`, `filter`, `sum` gibi metotlar
yalnız `Vec` ile çalışmaz; `Iterator` trait'ini uygulayan her tiple çalışır.
Kendi tipin için bu trait'i uygularsan onu da `for` ile dönebilir, adaptör
zincirine sokabilirsin. Yazman gereken tek metot `next`'tir; gerisi hazır
gelir.

## Nasıl

`Iterator` trait'i senden iki şey ister:

- `type Item`: ürettiğin öğelerin tipi. Trait'in içinde böyle tanımlanan
  tipe associated type denir.
- `next`: sıradaki öğeyi `Some(öğe)` olarak döndürür; öğe kalmadıysa `None`
  döndürür.

Geri sayan bir iterator:

```rust
struct Countdown {
    n: u32,
}

impl Iterator for Countdown {
    type Item = u32;

    fn next(&mut self) -> Option<u32> {
        if self.n == 0 {
            None
        } else {
            let current = self.n;
            self.n -= 1;
            Some(current)
        }
    }
}
```

Iterator nerede kaldığını kendi alanlarında tutar; burada `n`. Her `next`
çağrısı bir öğe verir ve durumu bir adım ilerletir. `next` bu yüzden
`&mut self` alır.

Artık `let c = Countdown { n: 3 };` yazıp `for x in c` ile dönebilirsin;
sırayla 3, 2, 1 gelir. Adaptörler de hazırdır:
`Countdown { n: 4 }.map(|x| x * 2).collect::<Vec<_>>()` sana `[8, 6, 4, 2]`
verir.

Sonu olmayan bir dizi de yazabilirsin: `next` hiç `None` döndürmez, hep
`Some` döndürür. Böyle bir iterator'ı kullanırken `take(n)` adaptörüyle
yalnız ilk `n` öğeyi alırsın.

## Dikkat

- `next` içinde durumu ilerletmeyi unutursan hep aynı öğe gelir ve `for`
  döngüsü hiç bitmez.
- Sonsuz bir iterator'a doğrudan `collect()` ya da `sum()` deme; program
  bitmez. Önce `take` ile sınırla.
- `next`'in asıl dönüş tipi `Option<Self::Item>`'dır. `Item = u32` yazdıysan
  `Option<u32>` aynı şeydir.
- `next`'i elle çağıracaksan değişkeni `let mut` ile tanımla. `for`
  döngüsünde buna gerek yok.
- `for` döngüsü iterator'ı alır (move); döngüden sonra aynı değişkeni
  kullanamazsın.
'''
example = '''
struct Countdown {
    n: u32,
}

impl Iterator for Countdown {
    type Item = u32;

    fn next(&mut self) -> Option<u32> {
        if self.n == 0 {
            None
        } else {
            let current = self.n;
            self.n -= 1;
            Some(current)
        }
    }
}

fn main() {
    for x in (Countdown { n: 3 }) {
        println!("{}", x);
    }
    let doubled: Vec<u32> = Countdown { n: 4 }.map(|x| x * 2).collect();
    println!("{:?}", doubled);
}
'''

