solution = '''
enum List {
    Cons(i32, Box<List>),
    Nil,
}

fn sum(list: &List) -> i32 {
    match list {
        List::Cons(v, rest) => v + sum(rest),
        List::Nil => 0,
    }
}

fn len(list: &List) -> usize {
    match list {
        List::Cons(_, rest) => 1 + len(rest),
        List::Nil => 0,
    }
}
'''
