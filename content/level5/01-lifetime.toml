tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn uzun_olan() {
        assert_eq!(longest("abc", "de"), "abc");
        assert_eq!(longest("a", "bcd"), "bcd");
    }
    #[test]
    fn esitse_ilki() {
        assert_eq!(longest("ab", "cd"), "ab");
    }
    #[test]
    fn ilk_kelime() {
        let e = Excerpt { text: "merhaba dünya" };
        assert_eq!(e.first_word(), "merhaba");
        assert_eq!(Excerpt { text: "" }.first_word(), "");
    }
    #[test]
    fn struct_dusse_de_gecerli() {
        let w;
        {
            let e = Excerpt { text: "bir iki" };
            w = e.first_word();
        }
        assert_eq!(w, "bir");
    }
}
'''
solution = '''
fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
    if a.len() >= b.len() {
        a
    } else {
        b
    }
}

struct Excerpt<'a> {
    text: &'a str,
}

impl<'a> Excerpt<'a> {
    fn first_word(&self) -> &'a str {
        for (i, c) in self.text.char_indices() {
            if c == ' ' {
                return &self.text[..i];
            }
        }
        self.text
    }
}
'''
