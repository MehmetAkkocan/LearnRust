solution = '''
fn sum_even_squares(v: &[i32]) -> i32 {
    v.iter().filter(|x| **x % 2 == 0).map(|x| x * x).sum()
}

fn label_words(words: &[&str]) -> Vec<String> {
    words
        .iter()
        .enumerate()
        .map(|(i, w)| format!("{}:{}", i, w))
        .collect()
}
'''
