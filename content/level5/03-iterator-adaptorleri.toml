id = "5-03"
title = "Iterator Adaptörleri"
read_points = 10
body_md = '''
## Neden

Bir listeden çift sayıları seçip karelerini almak istiyorsun. Döngüyle
yaparsın: boş bir `Vec` aç, `for` ile dön, `if` ile sına, `push` et.
Çalışır, ama asıl niyetin satırların arasında kaybolur. Iterator
adaptörleriyle aynı işi adım adım söylersin: seç, dönüştür, topla. Üstelik
yavaşlamaz; derleyici bu zinciri elle yazılmış döngü kadar hızlı koda
çevirir.

## Nasıl

Iterator, öğeleri sırayla tek tek veren şeydir. Üç adım var: `.iter()` ile
iterator al, adaptörleri arka arkaya ekle, en sonda bir tüketiciyle sonucu
al.

```rust
let v = vec![1, 2, 3, 4, 5, 6];
let result: Vec<i32> = v
    .iter()
    .filter(|x| **x % 2 == 0) // çiftleri bırak
    .map(|x| x * x)           // karesini al
    .collect();               // [4, 16, 36]
```

Adaptörler bir iterator alıp yenisini verir:

- `map(f)`: her öğeyi `f` ile dönüştürür.
- `filter(p)`: `p`'nin `true` dediği öğeleri bırakır, kalanını atar.
- `enumerate()`: her öğeyi sıra numarasıyla eşler: `(0, öğe)`, `(1, öğe)`...
- `zip(other)`: iki iterator'ın öğelerini çift çift eşler; kısa olan
  bitince durur.
- `cloned()`: referans yerine öğenin kopyasını verir.

Tüketiciler zinciri çalıştırıp tek bir sonuç üretir:

- `collect()`: öğeleri `Vec`, `String`, `HashMap` gibi bir koleksiyona
  toplar.
- `sum()`, `count()`, `max()`: toplam, öğe sayısı, en büyük öğe. `max()`
  bir `Option` döndürür, çünkü liste boş olabilir.
- `fold(start, f)`: `start` değeriyle başlar, her öğeyi `f` ile bu değere
  katar. `v.iter().fold(0, |acc, x| acc + x)` toplamı verir.

## Dikkat

- Adaptörler tembeldir (lazy): tüketici çağırmadıkça hiçbir şey çalışmaz.
  `v.iter().map(...);` yazıp bırakırsan derleyici
  `iterators are lazy and do nothing unless consumed` diye uyarır.
- `.iter()` öğelerin kendisini değil, referansını (`&i32`) verir. `filter`
  de öğeye referansla baktığı için closure'a `&&i32` gelir; `**x` bu
  yüzden. `map` içinde `x * x` yazabilirsin, çünkü çarpma referanslarla da
  çalışır.
- `.into_iter()` ise koleksiyonun kendisini alır (move) ve öğeleri
  referanssız verir; koleksiyonu sonra kullanamazsın.
- `collect()` neyi dolduracağını bilmek ister. Tipi ya değişkene yaz
  (`let v: Vec<i32> = ...`) ya da çağrıya (`collect::<Vec<_>>()`). `sum()`
  için de aynısı geçerli: `sum::<i32>()`.
'''
example = '''
fn main() {
    let numbers = vec![1, 2, 3, 4, 5, 6];

    let squares_of_even: Vec<i32> = numbers
        .iter()
        .filter(|x| **x % 2 == 0)
        .map(|x| x * x)
        .collect();
    println!("{:?}", squares_of_even);

    let total = numbers.iter().fold(0, |acc, x| acc + x);
    println!("toplam: {}", total);

    let names = ["ali", "veli", "can"];
    for (i, name) in names.iter().enumerate() {
        println!("{}: {}", i, name);
    }

    let pairs: Vec<(i32, &str)> = numbers.iter().cloned().zip(names.iter().cloned()).collect();
    println!("{:?}", pairs);
}
'''

[exercise]
prompt = '''`sum_even_squares(v)`, listedeki çift sayıların karelerini toplayıp döndürsün. Örnek: `[1, 2, 3, 4]` → `2*2 + 4*4 = 20`; çift sayı yoksa `0`. `label_words(words)` her kelimenin başına sıra numarasını koyup `"<sıra>:<kelime>"` biçiminde bir `String` üretsin ve bunları `Vec<String>` olarak döndürsün. Örnek: `["a", "b"]` → `["0:a", "1:b"]`. İkisini de `for` döngüsüyle değil, adaptör zinciriyle yaz. İpucu: ilki için `filter`, `map`, `sum`; ikincisi için `enumerate`, `map`, `collect` ve `format!("{}:{}", i, w)` işini görür.'''
