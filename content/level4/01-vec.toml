}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn cift_toplam() {
        assert_eq!(sum_even(&[1, 2, 3, 4, 5, 6]), 12);
    }
    #[test]
    fn bos_ve_negatif() {
        assert_eq!(sum_even(&[]), 0);
        assert_eq!(sum_even(&[-2, -3, 7]), -2);
    }
}
'''
solution = '''
fn sum_even(v: &[i32]) -> i32 {
    let mut sum = 0;
    for x in v.iter() {
        if *x % 2 == 0 {
            sum += *x;
        }
    }
    sum
}
'''
