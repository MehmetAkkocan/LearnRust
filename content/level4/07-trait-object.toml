solution = '''
trait Animal {
    fn speak(&self) -> String;
}

struct Dog;
struct Cat;

impl Animal for Dog {
    fn speak(&self) -> String {
        "hav".to_string()
    }
}

impl Animal for Cat {
    fn speak(&self) -> String {
        "miyav".to_string()
    }
}

fn chorus(animals: &[Box<dyn Animal>]) -> String {
    let mut out = String::new();
    for (i, a) in animals.iter().enumerate() {
        if i > 0 {
            out.push_str(", ");
        }
        out.push_str(&a.speak());
    }
    out
}
'''
