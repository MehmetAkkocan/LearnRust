fn largest<T: PartialOrd + Copy>(items: &[T]) -> Option<T> {
    if items.is_empty() {
        return None;
    }
    let mut best = items[0];
    for &x in items.iter() {
        if x > best {
            best = x;
        }
    }
    Some(best)
}
