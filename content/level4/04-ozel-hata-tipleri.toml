solution = '''
use std::error::Error;
use std::fmt;

#[derive(Debug, PartialEq)]
enum PortError {
    Empty,
    Invalid,
    Zero,
}

impl fmt::Display for PortError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        match self {
            PortError::Empty => write!(f, "boş girdi"),
            PortError::Invalid => write!(f, "geçersiz sayı"),
            PortError::Zero => write!(f, "port sıfır olamaz"),
        }
    }
}

impl Error for PortError {}

fn parse_port(s: &str) -> Result<u16, PortError> {
    let t = s.trim();
    if t.is_empty() {
        return Err(PortError::Empty);
    }
    let port: u16 = match t.parse() {
        Ok(p) => p,
        Err(_) => return Err(PortError::Invalid),
    };
    if port == 0 {
        return Err(PortError::Zero);
    }
    Ok(port)
}
'''
