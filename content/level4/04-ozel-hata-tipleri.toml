id = "4-04"
title = "Kendi Hata Tipini Yazmak"
read_points = 10
body_md = '''
## Neden

`ParseIntError` sana yalnızca "metin sayıya çevrilemedi" der. Senin
programının hataları ise kendi işine özgüdür: "port boş bırakılmış", "yaş
negatif", "kullanıcı bulunamadı". Bunları düz bir `String` mesajı olarak
döndürürsen, seni çağıran kod hangi hatanın çıktığını anlamak için metin
karşılaştırmak zorunda kalır. Hataları bir `enum` olarak yazarsan her hata
türü bir varyant olur; çağıran da `match` ile hangisi olduğuna bakıp ona
göre davranır.

## Nasıl

Üç adım var: hataları bir enum'da topla, `Display` ile her birinin
mesajını yaz, `Error` trait'ini ekle.

```rust
use std::error::Error;
use std::fmt;

#[derive(Debug, PartialEq)]
enum AgeError {
    Negative,
    TooHigh(u32),
}

impl fmt::Display for AgeError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        match self {
            AgeError::Negative => write!(f, "yaş negatif olamaz"),
            AgeError::TooHigh(n) => write!(f, "{} çok büyük", n),
        }
    }
}

impl Error for AgeError {}
```

`Display` ve `Error` birer trait'tir. Trait'i bir sonraki derste
anlatacağız; şimdilik "bir tipin yazması gereken metotların listesi" diye
düşün.

- `Display`, tipin `{}` ile nasıl yazdırılacağını belirler ve elle
  yazılır. `write!(f, "...")` tıpkı `println!` gibi çalışır, ama ekrana
  değil `f`'ye yazar. `Display` yazınca `to_string()` metodu da hazır gelir.
- `Debug` (`{:?}` çıktısı) `derive` ile gelir.
- `impl Error for AgeError {}` bloğunun içi boş kalabilir. Ama tipte hem
  `Debug` hem `Display` olmak zorunda; biri eksikse kod derlenmez.
- `PartialEq` türetirsen hataları `==` ile karşılaştırabilirsin. Testte
  `assert_eq!(f(x), Err(AgeError::Negative))` yazabilmek için bu gerekir.

Artık fonksiyonun `Result<u32, AgeError>` döndürebilir; hata vermek için
`return Err(AgeError::Negative);` yazarsın.

Farklı tipte hataları aynı fonksiyondan döndürmek istersen dönüş tipini
`Result<T, Box<dyn Error>>` yap. `Box<dyn Error>`, "`Error` trait'ini
uygulayan herhangi bir hata" demektir; böyle bir fonksiyonda `?`, hatayı
kendiliğinden bu tipe çevirir. `Box` ve `dyn` konusuna bu seviyenin son
dersinde döneceğiz.

## Dikkat

- `Display` mesajını kısa tut, küçük harfle başlat, sonuna nokta koyma;
  böylece başka bir mesajın içine eklendiğinde de düzgün durur. `Display`
  kullanıcıya gösterilen mesajdır, `Debug` geliştiricinin göreceği çıktı.
- Varyantın içine veri koyabilirsin (`TooHigh(u32)`); hata böylece ayrıntı
  da taşır. `PartialEq` türetebilmek için içteki tiplerin de `==` ile
  karşılaştırılabilir olması gerekir.
- Hatayı `Box<dyn Error>` olarak döndürürsen çağıran, hangi varyantın
  geldiğini artık `match` ile kolayca ayıramaz. Çağıranın hataya göre karar
  vermesi gerekiyorsa kendi enum'unu döndür.
'''
example = '''
use std::error::Error;
use std::fmt;

#[derive(Debug, PartialEq)]
enum AgeError {
    NotNumber,
    Negative,
}

impl fmt::Display for AgeError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        match self {
            AgeError::NotNumber => write!(f, "sayı değil"),
            AgeError::Negative => write!(f, "yaş negatif olamaz"),
        }
    }
}

impl Error for AgeError {}

fn parse_age(s: &str) -> Result<u32, AgeError> {
    let n: i64 = match s.trim().parse() {
        Ok(n) => n,
        Err(_) => return Err(AgeError::NotNumber),
    };
    if n < 0 {
        return Err(AgeError::Negative);
    }
    Ok(n as u32)
}

fn run() -> Result<(), Box<dyn Error>> {
    let age = parse_age("30")?;
    println!("Yaş: {}", age);
    let bad = parse_age("-5")?;
    println!("Buraya gelinmez: {}", bad);
    Ok(())
}

fn main() {
    if let Err(e) = run() {
        println!("Hata: {}", e);
    }
}
'''

