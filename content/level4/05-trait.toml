solution = '''
trait Area {
    fn area(&self) -> f64;

    fn is_large(&self) -> bool {
        self.area() > 100.0
    }
}

struct Rect {
    w: f64,
    h: f64,
}

impl Area for Rect {
    fn area(&self) -> f64 {
        self.w * self.h
    }
}
