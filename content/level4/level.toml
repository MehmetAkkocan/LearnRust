[[quiz.coding]]
id = "4-q1"
prompt = '''`parse_scores(input: &str) -> Result<HashMap<String, i32>, ScoreError>` fonksiyonunu yaz. Girdi, `;` ile ayrılmış `isim=sayı` parçalarından oluşur: `"ali=10;veli=20;ali=5"`. Her ismin toplam puanını bir map'te döndür; aynı isim birden çok kez geçerse puanlarını topla. Bu örneğin sonucu `"ali"` → 15, `"veli"` → 20 olur. Boş parçaları atla; boş girdi boş bir map verir. İçinde `=` olmayan bir parça görürsen `Err(ScoreError::MissingSeparator)`, `=`'den sonraki kısım `i32`'ye çevrilemiyorsa `Err(ScoreError::BadNumber)` döndür. İpucu: `input.split(';')` parçaları sırayla verir, `for` ile dolaşabilirsin. `part.split_once('=')` parçayı ilk `=`'den ikiye böler ve `Option<(&str, &str)>` döndürür; `=` yoksa `None` gelir.'''
starter = '''
use std::collections::HashMap;

#[derive(Debug, PartialEq)]
enum ScoreError {
    MissingSeparator,
    BadNumber,
}

fn parse_scores(input: &str) -> Result<HashMap<String, i32>, ScoreError> {
    todo!()
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn toplar() {
        let got = parse_scores("ali=10;veli=20;ali=5").unwrap();
        let mut expected = HashMap::new();
        expected.insert("ali".to_string(), 15);
        expected.insert("veli".to_string(), 20);
        assert_eq!(got, expected);
    }

    #[test]
    fn bos_girdi() {
        assert_eq!(parse_scores(""), Ok(HashMap::new()));
    }

    #[test]
    fn ayirac_yok() {
        assert_eq!(parse_scores("ali=10;veli"), Err(ScoreError::MissingSeparator));
    }

    #[test]
    fn kotu_sayi() {
        assert_eq!(parse_scores("ali=abc"), Err(ScoreError::BadNumber));
    }
}
'''
solution = '''
use std::collections::HashMap;

#[derive(Debug, PartialEq)]
enum ScoreError {
    MissingSeparator,
    BadNumber,
}

fn parse_scores(input: &str) -> Result<HashMap<String, i32>, ScoreError> {
    let mut map = HashMap::new();
    for part in input.split(';') {
        if part.is_empty() {
            continue;
        }
        let (name, value) = part.split_once('=').ok_or(ScoreError::MissingSeparator)?;
        let number: i32 = match value.trim().parse() {
            Ok(n) => n,
            Err(_) => return Err(ScoreError::BadNumber),
        };
        *map.entry(name.to_string()).or_insert(0) += number;
    }
    Ok(map)
}
'''

