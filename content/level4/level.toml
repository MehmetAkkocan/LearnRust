solution = '''
trait Scorer {
    fn score(&self, word: &str) -> u32;
}

struct LengthScorer;

impl Scorer for LengthScorer {
    fn score(&self, word: &str) -> u32 {
        word.chars().count() as u32
    }
}

struct VowelScorer;

impl Scorer for VowelScorer {
    fn score(&self, word: &str) -> u32 {
        let mut count = 0;
        for c in word.chars() {
            match c {
                'a' | 'e' | 'i' | 'o' | 'u' => count += 1,
                _ => {}
            }
        }
        count
    }
}

fn total_score(scorers: &[Box<dyn Scorer>], word: &str) -> u32 {
    let mut total = 0;
    for s in scorers.iter() {
        total += s.score(word);
    }
    total
}
'''
