prompt = "There are three parts; the code compiles but works wrongly or is incomplete. (1) `log_all`: for every item in `items`, push `\"saw:<item>\"` onto `log` (`\"saw:ab\"` for `\"ab\"`). If you try to do this with a helper method that takes `&mut self` you get E0502; use the `self.items` and `self.log` fields directly in the loop. (2) `upcase_longest`: turn the longest item into upper case; if several have the same length, the first of them. Do nothing if the list is empty. Don't hold a reference to the item: get the index from the provided `longest_index()`, then change `self.items[i]`. (3) `transfer`: subtract `amount` from `v[from]` and add it to `v[to]`. Instead of taking two `&mut` (E0499), write the two steps one after the other. Example: with `[10, 0, 5]`, `transfer(&mut v, 0, 1, 4)` → `[6, 4, 5]`."
