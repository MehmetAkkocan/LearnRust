prompt = "`count_atomic(threads, per_thread)` takes two numbers. Create a shared `AtomicUsize` counter and start `threads` threads; each thread adds 1 to the counter `per_thread` times. `join` all the threads, then return the final value of the counter. Example: `count_atomic(4, 1000)` → `4000`; `count_atomic(0, 10)` → `0`."
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn four_threads() {
        assert_eq!(count_atomic(4, 1000), 4000);
    }

    #[test]
    fn zero_threads() {
        assert_eq!(count_atomic(0, 10), 0);
    }

    #[test]
    fn one_thread() {
        assert_eq!(count_atomic(1, 5), 5);
    }
}
