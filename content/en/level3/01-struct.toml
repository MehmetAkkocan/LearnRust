title = "Structs: Keep Related Data Together"
body_md = '''
## Why

It takes two numbers to describe a point: `x` and `y`. If you keep them in
separate variables, it's on you to remember which `x` goes with which `y`, and
every function has to take both. A `struct` lets you put data that belongs
together into one type and give each piece a name. Instead of
`fn distance(x: i32, y: i32)` you write `fn distance(p: &Point)`, and anyone
can see at a glance what the function expects.

## How

First you define the type: you write the name and type of each field. Then you
create a value of that type by giving every field a value.

```rust
struct Point {
    x: i32,
    y: i32,
}

let p = Point { x: 1, y: 2 };
println!("{}", p.x); // 1
```

- Fields are separated by commas; the comma after the last field is optional.
- You reach a field with a dot: `p.x`. If you have a reference such as
  `&Point`, you still just write `p.x`.
- To change a field, declare the variable with `let mut p`; then you can write
  `p.x = 5;`.
- If a variable has the same name as the field, you don't have to write it
  twice: `Point { x, y }` instead of `Point { x: x, y: y }`.
- You can set some fields yourself and take the rest from another value:
  `Point { x: 5, ..p }`. Here `y` comes from `p`.
- A struct can also have fields without names: `struct Meters(f64);`. This is
  called a tuple struct; you reach the value inside with `m.0`.
- Put `#[derive(Debug, PartialEq, Clone)]` above the definition and the
  compiler writes three things for you: printing with `{:?}`, comparing with
  `==`, and copying with `.clone()`.

## Watch out

- `mut` applies to the whole variable. You can't say "let `x` change but not
  `y`".
- When you write `..p`, fields that can't be copied, such as a `String`, are
  moved into the new value; after that you can't use those fields of `p`. If
  you still need `p`, write `..p.clone()`.
- Without `#[derive(Debug)]`, `println!("{:?}", p)` doesn't compile. The
  compiler says `` `Point` doesn't implement `Debug` ``, meaning "I don't know
  how to print this type".
- You must give every field when you create a value. Leave one out and you get
  `` missing field `y` in initializer of `Point` ``.
'''
example = '''
#[derive(Debug, Clone, PartialEq)]
struct User {
    name: String,
    age: u32,
    active: bool,
}

struct Meters(f64);

fn main() {
    let u = User { name: String::from("Alice"), age: 30, active: true };
    // name is new; age and active come from a copy of u
    let v = User { name: String::from("Bob"), ..u.clone() };
    println!("{:?}", u);
    println!("{:?}", v);
    println!("{}", u == v); // false: the names differ
    let m = Meters(12.5);
    println!("{} meters", m.0);
}
'''

[exercise]
prompt = "Write three functions. `make_point(x, y)` returns a `Point` with the given `x` and `y`. `manhattan(p)` returns the point's distance from the origin as `|x| + |y|`; e.g. 7 for the point (-3, 4). `shift(p, dx, dy)` returns a new `Point` with `x` moved by `dx` and `y` moved by `dy`; e.g. the point (1, 1) with `dx = 2`, `dy = -3` becomes (3, -2). Hint: `.abs()` gives the absolute value of an `i32`, e.g. `p.x.abs()`."
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn creates_point() {
        assert_eq!(make_point(1, 2), Point { x: 1, y: 2 });
    }

    #[test]
    fn distance() {
        assert_eq!(manhattan(&Point { x: -3, y: 4 }), 7);
        assert_eq!(manhattan(&make_point(0, 0)), 0);
    }

    #[test]
    fn shifts_point() {
        let p = shift(Point { x: 1, y: 1 }, 2, -3);
        assert_eq!(p, Point { x: 3, y: -2 });
        assert_eq!(p.x, 3);
    }
}
'''
