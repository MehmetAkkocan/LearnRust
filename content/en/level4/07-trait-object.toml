tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn chorus_of_three() {
        let v: Vec<Box<dyn Animal>> = vec![Box::new(Dog), Box::new(Cat), Box::new(Dog)];
        assert_eq!(chorus(&v), "woof, meow, woof");
    }
    #[test]
    fn single_and_empty() {
        let one: Vec<Box<dyn Animal>> = vec![Box::new(Cat)];
        assert_eq!(chorus(&one), "meow");
        let none: Vec<Box<dyn Animal>> = Vec::new();
        assert_eq!(chorus(&none), "");
    }
}
'''
solution = '''
trait Animal {
    fn speak(&self) -> String;
}

struct Dog;
struct Cat;

impl Animal for Dog {
    fn speak(&self) -> String {
        "woof".to_string()
    }
}

impl Animal for Cat {
    fn speak(&self) -> String {
        "meow".to_string()
    }
}

fn chorus(animals: &[Box<dyn Animal>]) -> String {
    let mut out = String::new();
    for (i, a) in animals.iter().enumerate() {
        if i > 0 {
            out.push_str(", ");
        }
        out.push_str(&a.speak());
    }
    out
}
'''
