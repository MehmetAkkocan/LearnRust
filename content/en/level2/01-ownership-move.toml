tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn concatenates() {
        let a = String::from("ab");
        let b = String::from("cd");
        let c = concat(a, b);
        assert_eq!(c, "abcd");
        assert_eq!(concat(String::new(), String::from("x")), "x");
    }
}
'''
solution = '''
fn concat(a: String, b: String) -> String {
    format!("{}{}", a, b)
}
