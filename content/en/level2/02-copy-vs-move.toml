'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn gives_it_back() {
        let (s, n) = text_and_length(String::from("hello"));
        assert_eq!(n, 5);
        assert_eq!(s, "hello");
    }
    #[test]
    fn empty() {
        let (s, n) = text_and_length(String::new());
        assert_eq!(n, 0);
        assert_eq!(s, "");
    }
}
'''
solution = '''
fn text_and_length(s: String) -> (String, usize) {
    let n = s.len();
    (s, n)
}
'''
