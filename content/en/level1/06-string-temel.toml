    todo!()
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn greeting() {
        assert_eq!(build_greeting("Ali"), "Hello Ali!");
        assert_eq!(build_greeting("Zoë"), "Hello Zoë!");
        assert_eq!(build_greeting(""), "Hello !");
    }
}
'''
solution = '''
fn build_greeting(name: &str) -> String {
    let mut s = String::from("Hello ");
    s.push_str(name);
    s.push('!');
    s
}
'''
