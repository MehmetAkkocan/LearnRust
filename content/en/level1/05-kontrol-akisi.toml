title = "Conditions and Loops"
body_md = '''
## Why

A program does two things all the time: it decides what to do based on the
situation, and it repeats the same work. You use `if` to decide and a loop to
repeat. If you know another language, most of this will look familiar. There
is one difference: in Rust `if` is an expression, so it produces a value. You
can put its result straight into a variable; you don't have to create an empty
variable first and fill it in afterwards.

## How

A condition comes after `if`. Its type must be `bool`; it needs no parentheses
around it:

```rust
let n = 7;
let kind = if n % 2 == 0 { "even" } else { "odd" };
```

`%` gives the remainder of a division; `n % 2 == 0` asks "does 2 divide n
evenly?". If there are more than two cases, you add `else if` in between:
`if n < 0 { "negative" } else if n == 0 { "zero" } else { "positive" }`.
The conditions are tried from top to bottom; only the first branch that
matches runs.

There are three kinds of loop:

```rust
// loop: runs until you say break; break can also hand back a value
let mut c = 0;
let found = loop {
    c += 1;
    if c == 5 { break c * 2; }
};                                 // found = 10

// while: runs as long as the condition is true
let mut k = 3;
while k > 0 { k -= 1; }

// for: visits the elements of a range or an array in order
for i in 0..3 { /* i: 0, 1, 2 */ }
for i in 1..=3 { /* i: 1, 2, 3 */ }
```

The range `a..b` does not include `b`; `a..=b` does. `break` leaves the loop.
`continue` skips the rest of the current round and moves on to the next one.
When you want to visit elements in order, use `for`: you don't advance the
counter by hand, so you can't forget to advance it or run past the end.

## Watch out

- If `n` is an integer, `if n { ... }` does not compile. Rust won't turn a
  number into a `bool` for you; write what you are asking: `if n != 0 { ... }`.
- If you use the value of an `if`, the `else` is required and every branch
  must give a value of the same type. One branch can't give a number while
  the other gives text.
- `0..3` does not contain 3. If you want 3 as well, write `0..=3`.
- In a `while` loop, if you forget to change the counter, the condition stays
  true forever and the program never leaves the loop.
'''
example = '''
fn main() {
    let mut total = 0;
    for i in 1..=5 {
        if i % 2 == 1 {
            continue;
        }
        total += i;
    }
    println!("Sum of the even numbers: {}", total);
}
'''

[exercise]
prompt = "Write the function `sum_even(limit: u32) -> u32`. Add up the even numbers from 1 to `limit` and return the total; `limit` itself is included. Example: `sum_even(10)` → 2 + 4 + 6 + 8 + 10 = 30. If there are no even numbers in that range (`limit` is 0 or 1), the result is 0. Use a `for` loop."
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn sums_even_numbers() {
        assert_eq!(sum_even(10), 30);
        assert_eq!(sum_even(0), 0);
        assert_eq!(sum_even(1), 0);
        assert_eq!(sum_even(7), 12);
    }
}
'''
