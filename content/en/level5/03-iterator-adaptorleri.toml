title = "Iterator Adaptors"
body_md = '''
## Why

You want to pick the even numbers out of a list and square them. With a
loop you create an empty `Vec`, walk the list with `for`, test with `if`,
and `push`. It works, but what you meant gets lost between the lines.
Iterator adaptors let you say it step by step: pick, transform, collect.
And it is not slower; the compiler turns the chain into code as fast as a
hand-written loop.

## How

An iterator hands out items one at a time, in order. Three steps: get an
iterator with `.iter()`, chain adaptors, and finish with a consumer that
produces the result.

```rust
let v = vec![1, 2, 3, 4, 5, 6];
let result: Vec<i32> = v
    .iter()
    .filter(|x| **x % 2 == 0) // keep the even ones
    .map(|x| x * x)           // square them
    .collect();               // [4, 16, 36]
```

Adaptors turn an iterator into a new one:

- `map(f)`: transforms every item with `f`.
- `filter(p)`: keeps the items where `p` says `true`, drops the rest.
- `enumerate()`: pairs every item with its position: `(0, item)`,
  `(1, item)`...
- `zip(other)`: pairs up the items of two iterators; stops when the
  shorter one runs out.
- `cloned()`: gives a copy of each item instead of a reference.

Consumers run the chain and produce one result:

- `collect()`: gathers the items into a collection such as `Vec`,
  `String` or `HashMap`.
- `sum()`, `count()`, `max()`: the total, the number of items, the
  largest item. `max()` returns an `Option`: the list may be empty.
- `fold(start, f)`: starts with `start` and uses `f` to merge each item
  into it. `v.iter().fold(0, |acc, x| acc + x)` gives the total.

## Watch out

- Adaptors are lazy: nothing runs until you call a consumer. Write only
  `v.iter().map(...);` and the compiler warns
  `iterators are lazy and do nothing unless consumed`.
- `.iter()` gives references to the items (`&i32`), not the items.
  `filter` also looks at each item through a reference, so its closure
  receives `&&i32`; hence `**x`. In `map` you can write `x * x`, because
  multiplication works on references too.
- `.into_iter()` takes the collection itself (a move) and gives the items
  without references; the collection is unusable afterwards.
- `collect()` needs to know what to build. Put the type on the variable
  (`let v: Vec<i32> = ...`) or on the call (`collect::<Vec<_>>()`).
  Likewise for `sum()`: `sum::<i32>()`.
'''
example = '''
fn main() {
    let numbers = vec![1, 2, 3, 4, 5, 6];

    let squares_of_even: Vec<i32> = numbers
        .iter()
        .filter(|x| **x % 2 == 0)
        .map(|x| x * x)
        .collect();
    println!("{:?}", squares_of_even);

    let total = numbers.iter().fold(0, |acc, x| acc + x);
    println!("total: {}", total);

    let names = ["ann", "bob", "cy"];
    for (i, name) in names.iter().enumerate() {
        println!("{}: {}", i, name);
    }

    let pairs: Vec<(i32, &str)> = numbers.iter().cloned().zip(names.iter().cloned()).collect();
    println!("{:?}", pairs);
}
'''

[exercise]
prompt = '''`sum_even_squares(v)` returns the sum of the squares of the even numbers in the list. Example: `[1, 2, 3, 4]` → `2*2 + 4*4 = 20`; if there are no even numbers, `0`. `label_words(words)` puts each word's position in front of it, building a `String` of the form `"<position>:<word>"`, and returns them as a `Vec<String>`. Example: `["a", "b"]` → `["0:a", "1:b"]`. Write both with an adaptor chain, not a `for` loop. Hint: `filter`, `map` and `sum` do the first one; `enumerate`, `map`, `collect` and `format!("{}:{}", i, w)` do the second.'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn even_squares() {
        assert_eq!(sum_even_squares(&[1, 2, 3, 4]), 20);
        assert_eq!(sum_even_squares(&[1, 3]), 0);
        assert_eq!(sum_even_squares(&[]), 0);
    }
    #[test]
    fn labels() {
        assert_eq!(label_words(&["a", "b"]), vec!["0:a".to_string(), "1:b".to_string()]);
        assert!(label_words(&[]).is_empty());
    }
}
'''
