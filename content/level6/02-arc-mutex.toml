id = "6-02"
title = "Arc ve Mutex: Veriyi Thread'ler Arasında Paylaşmak"
read_points = 10
body_md = '''
## Neden

Bir programın içinde aynı anda birden çok iş yürütebilirsin; bunların
her birine thread denir. İki thread aynı veriye aynı anda dokunur ve en
az biri yazıyorsa sonuç bozulabilir. Buna data race denir. Rust'ta data
race'e yol açacak kod derlenmez.

`Rc` ile `RefCell` bu iş için yapılmamıştır; ikisi de tek thread
varsayar. Thread'ler arasında onların yerini şu iki tip alır:

- `Arc<T>` (atomic reference counted): `Rc`'nin thread'ler arasında
  güvenli olanı. İki thread sayacı aynı anda değiştirse bile sayaç
  bozulmaz.
- `Mutex<T>`: veriyi bir lock'un arkasına koyar. Veriye ulaşmak için
  önce lock'u alırsın; sen bırakana kadar diğer thread'ler bekler.

## Nasıl

Alışılmış kalıp `Arc<Mutex<T>>`. Her thread için `Arc::clone` ile yeni
bir sahip çıkarırsın, thread kendi `Arc`'ını alır. Thread'i nasıl
başlatacağını bir sonraki derste göreceksin; şimdilik lock'a bak.

```rust
use std::sync::{Arc, Mutex};

let counter = Arc::new(Mutex::new(0));
let c = Arc::clone(&counter);
// başka bir thread'in içinde:
*c.lock().unwrap() += 1;
```

- `lock()` lock boşalana kadar bekler, sonra bir
  `Result<MutexGuard<T>, _>` döndürür. `unwrap()` ile içindeki guard'ı
  alırsın.
- Guard, lock'un sende olduğunu gösteren değerdir. `*guard` ile veriye
  ulaşırsın. Guard silinince (drop), yani çoğunlukla kapsam bitince,
  lock kendiliğinden bırakılır; ayrıca "bırak" demen gerekmez.
- Sonucu okumadan önce thread'lerin bitmesini `join` ile beklersin.
  Yoksa işi yarım kalmış bir değer okuyabilirsin.

## Dikkat

- Lock'u gerektiğinden uzun tutma. Guard'ı tek satırda ya da küçük bir
  blokta kullan ki diğer thread'ler boşuna beklemesin.
- İki ayrı lock'u biri A-B, öbürü B-A sırasıyla alan iki thread
  birbirini sonsuza kadar bekleyebilir. Buna deadlock denir. Lock'ları
  her yerde aynı sırayla al.
- Aynı thread'de, guard hâlâ dururken aynı mutex'e ikinci kez `lock()`
  dersen program ya takılıp kalır ya da panic olur.
- Bir thread lock'u tutarken panic olursa mutex "poisoned" (zehirli)
  diye işaretlenir ve sonraki `lock()` çağrıları `Err` döndürür.
  Örneklerdeki `unwrap()` bu durumda panic olur.
- `Arc<T>` tek başına yalnız okutur. İçindekini değiştirmek için
  `Mutex` gibi bir sarmalayıcı gerekir.
'''
example = '''
use std::sync::{Arc, Mutex};
use std::thread;

fn main() {
    let counter = Arc::new(Mutex::new(0));
    let mut handles = Vec::new();

    for _ in 0..4 {
        let c = Arc::clone(&counter);
        handles.push(thread::spawn(move || {
            for _ in 0..1000 {
                *c.lock().unwrap() += 1;
            }
        }));
    }

    for h in handles {
        h.join().unwrap();
    }

    println!("Sonuç: {}", *counter.lock().unwrap());
}
'''

