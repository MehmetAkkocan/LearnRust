tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    use std::thread;

    // Her id için bir thread açar; thread'ler add_id ile ortak listeye yazar.
    fn collect_ids(threads: u32) -> Vec<u32> {
        let shared = Arc::new(Mutex::new(Vec::new()));
        let mut handles = Vec::new();
        for id in 0..threads {
            let s = Arc::clone(&shared);
            handles.push(thread::spawn(move || add_id(&s, id)));
        }
        for h in handles {
            h.join().unwrap();
        }
        sorted_ids(&shared)
    }

    #[test]
    fn id_listesi() {
        assert_eq!(collect_ids(8), (0..8).collect::<Vec<u32>>());
    }

    #[test]
    fn bos() {
        assert_eq!(collect_ids(0), Vec::<u32>::new());
    }

    #[test]
    fn kopya_doner() {
        let shared = Arc::new(Mutex::new(vec![3, 1]));
        add_id(&shared, 2);
        assert_eq!(sorted_ids(&shared), vec![1, 2, 3]);
        // Ortak liste sıralanmamalı; yalnız kopya sıralanır.
        assert_eq!(*shared.lock().unwrap(), vec![3, 1, 2]);
    }
}
'''
solution = '''
use std::sync::{Arc, Mutex};

pub fn add_id(shared: &Arc<Mutex<Vec<u32>>>, id: u32) {
    shared.lock().unwrap().push(id);
}

pub fn sorted_ids(shared: &Arc<Mutex<Vec<u32>>>) -> Vec<u32> {
    let mut v = shared.lock().unwrap().clone();
    v.sort();
    v
}
'''
