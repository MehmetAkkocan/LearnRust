prompt = "Bu egzersizde thread'leri testler açıyor; thread açmayı bir sonraki derste öğreneceksin. Sen yalnız lock'u alıp ortak listeye erişen iki fonksiyonu yaz. `add_id(shared, id)`: lock'u al ve `id`'yi ortak listenin sonuna ekle (`push`). `sorted_ids(shared)`: lock'u al ve listenin küçükten büyüğe sıralanmış bir KOPYASINI döndür; ortak listenin kendisi değişmesin. Örnek: ortak liste `[3, 1, 2]` ise `sorted_ids` `[1, 2, 3]` döndürür, ortak liste `[3, 1, 2]` olarak kalır. İpucu: `lock().unwrap()` sana guard'ı verir; kopya için `.clone()`, sıralamak için `.sort()` kullan."
