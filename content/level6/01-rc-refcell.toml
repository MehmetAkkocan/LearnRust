solution = '''
use std::cell::RefCell;
use std::rc::Rc;

pub fn make_shared(v: i32) -> Rc<RefCell<i32>> {
    Rc::new(RefCell::new(v))
}

pub fn add_one(c: &Rc<RefCell<i32>>) {
    *c.borrow_mut() += 1;
}
'''
