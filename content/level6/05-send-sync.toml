solution = '''
use std::thread;

pub fn with_thread<T, F>(value: T, f: F) -> T
where
    T: Send + 'static,
    F: FnOnce(T) -> T + Send + 'static,
{
    thread::spawn(move || f(value)).join().unwrap()
}
'''
