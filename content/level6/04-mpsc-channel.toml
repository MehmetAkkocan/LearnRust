solution = '''
use std::sync::mpsc;
use std::thread;

pub fn collect_from_workers(workers: u32) -> Vec<u32> {
    let (tx, rx) = mpsc::channel();
    for id in 0..workers {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send(id * 10).unwrap();
        });
    }
    drop(tx);
    let mut out: Vec<u32> = rx.iter().collect();
    out.sort();
    out
}
'''
