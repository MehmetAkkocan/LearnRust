id = "6-06"
title = "Future, poll ve Küçük Bir Executor"
read_points = 10
body_md = '''
## Neden

Bekleyen her iş için ayrı bir thread açmak pahalıdır. `async` kod başka
bir yol izler: bir iş "henüz hazır değilim" diyebilir; o zaman thread
onu bekleyip durmaz, başka işe geçer.

Bunun altında `Future` trait'i var. Future, sonucu sonradan hazır olacak
bir iştir. Future'ı bitene kadar tekrar tekrar yoklayan koda executor
denir. Gerçek projelerde executor'ı Tokio gibi bir kütüphaneden alırsın.
Nasıl çalıştığını görmek için ise standart kütüphane yeter; bu derste en
küçüğünü kendin yazacaksın.

## Nasıl

`Future` trait'inde tek metot var:

```rust
fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;
```

`poll` etmek "bitti mi?" diye sormaktır. Cevap `Poll::Ready(v)` ise iş
bitmiştir, sonuç `v`'dir. `Poll::Pending` ise henüz bitmemiştir.
`Pending` dönen future, hazır olunca `cx.waker()` ile executor'a haber
vermeyi üstlenir.

En küçük executor, tek bir future'ı bitene kadar yoklayan `block_on`:

```rust
fn block_on<F: Future>(fut: F) -> F::Output {
    let mut fut = Box::pin(fut);
    let waker = Waker::from(Arc::new(NoopWake));
    let mut cx = Context::from_waker(&waker);
    loop {
        if let Poll::Ready(v) = fut.as_mut().poll(&mut cx) {
            return v;
        }
    }
}
```

- `Box::pin(fut)` future'ı heap'e koyar ve yerini sabitler (`Pin`).
  `poll` sabitlenmiş bir future ister.
- `Context` için bir `Waker` gerekir. `Wake` trait'ini uygulayan bir
  tipi `Arc`'a koyup `Waker::from(..)` ile waker'a çevirirsin. Buradaki
  `NoopWake` çağrılınca hiçbir şey yapmaz.
- Future'ı elle yazmak zorunda değilsin. Bir `async fn`'i çağırınca ya
  da `async { ... }` bloğu yazınca derleyici senin için bir future
  üretir.
- `.await` yalnız `async` içinde yazılır: "bu future bitsin, sonucunu
  ver" demektir.

## Dikkat

- Future tembeldir: biri `poll` etmedikçe ya da `.await` demedikçe
  içindeki kod hiç çalışmaz.
- Buradaki `block_on`, `Pending` gelince beklemeden yeniden sorar (busy
  loop) ve işlemciyi boşuna yorar. Gerçek executor'lar waker çağrılana
  kadar uyur.
- Bu yüzden `Pending` döndürüp waker'ı hiç çağırmayan bir future, gerçek
  bir executor'da sonsuza kadar uyur.
- Sabitlenmiş bir future bellekte başka yere taşınamaz. Sabitlemek için
  `Box::pin` ya da `std::pin::pin!` kullanılır.
'''
example = '''
use std::future::Future;
use std::pin::Pin;
use std::sync::Arc;
use std::task::{Context, Poll, Wake, Waker};

struct NoopWake;

impl Wake for NoopWake {
    fn wake(self: Arc<Self>) {}
}

// remaining kadar Pending döner, sonra hazır olur.
struct CountDown {
    remaining: u32,
}

impl Future for CountDown {
    type Output = &'static str;

    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {
        let this = self.get_mut();
        if this.remaining == 0 {
            Poll::Ready("bitti")
        } else {
            this.remaining -= 1;
            cx.waker().wake_by_ref();
            Poll::Pending
        }
    }
}

fn block_on<F: Future>(fut: F) -> F::Output {
    let mut fut = Box::pin(fut);
    let waker = Waker::from(Arc::new(NoopWake));
    let mut cx = Context::from_waker(&waker);
    loop {
        if let Poll::Ready(v) = fut.as_mut().poll(&mut cx) {
            return v;
        }
    }
}

async fn add(a: i32, b: i32) -> i32 {
    a + b
}

fn main() {
    println!("{}", block_on(CountDown { remaining: 3 }));
    let total = block_on(async {
        let x = add(1, 2).await;
        add(x, 10).await
    });
    println!("{}", total);
}
'''

