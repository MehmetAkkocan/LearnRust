solution = '''
use std::sync::Mutex;

pub struct Bank {
    accounts: Mutex<Vec<i64>>,
}

impl Bank {
    pub fn new(balances: Vec<i64>) -> Self {
        Bank {
            accounts: Mutex::new(balances),
        }
    }

    pub fn balance(&self, idx: usize) -> Option<i64> {
        self.accounts.lock().unwrap().get(idx).map(|v| *v)
    }

    pub fn transfer(&self, from: usize, to: usize, amount: i64) -> Result<(), String> {
        let mut acc = self.accounts.lock().unwrap();
        if from >= acc.len() || to >= acc.len() {
            return Err("no such account".to_string());
        }
        if acc[from] < amount {
            return Err("insufficient funds".to_string());
        }
        acc[from] -= amount;
        acc[to] += amount;
        Ok(())
    }
}
'''
