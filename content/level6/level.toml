[[quiz.coding]]
id = "6-q1"
prompt = "`word_total(chunks)` bir `Vec<String>` alır ve bütün parçalardaki toplam kelime sayısını `usize` olarak döndürür. Her parça için ayrı bir thread aç; thread kendi parçasındaki kelimeleri saysın (`split_whitespace().count()`) ve sayıyı bir mpsc channel'ına göndersin. Ana thread gelen sayıları toplayıp döndürsün. Örnek: `[\"bir iki uc\", \"dort bes\"]` → `5`; boş liste → `0`. Asıl `Sender`'ı `drop` etmeyi unutma, yoksa mesajları alan döngü bitmez."
starter = '''
use std::sync::mpsc;
use std::thread;

pub fn word_total(chunks: Vec<String>) -> usize {
    todo!()
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn toplam_kelime() {
        let chunks = vec![
            "bir iki uc".to_string(),
            "dort bes".to_string(),
            "".to_string(),
            "  alti   yedi  ".to_string(),
        ];
        assert_eq!(word_total(chunks), 7);
    }

    #[test]
    fn bos_girdi() {
        assert_eq!(word_total(Vec::new()), 0);
    }

    #[test]
    fn cok_parca() {
        let chunks: Vec<String> = (0..20).map(|_| "a b c".to_string()).collect();
        assert_eq!(word_total(chunks), 60);
    }
}
'''
solution = '''
use std::sync::mpsc;
use std::thread;

pub fn word_total(chunks: Vec<String>) -> usize {
    let (tx, rx) = mpsc::channel();
    for chunk in chunks {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send(chunk.split_whitespace().count()).unwrap();
        });
    }
    drop(tx);
    rx.iter().sum()
}
'''
points = 50

